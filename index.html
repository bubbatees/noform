<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NO FORM — Efficiency meets taste.</title>
  <meta name="description" content="AI-enhanced creative production with human direction. Ad creatives, video, web design, email, and more.">
  <link rel="icon" href="assets/mark-noform.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       NO FORM — Colors & Type
       Editorial. Dark. Cinematic.
       ============================================================ */
    :root {
      --nf-black:        #000000;
      --nf-ink:          #0A0A0A;
      --nf-graphite:     #141414;
      --nf-shadow:       #1A1A1A;
      --nf-slate:        #242424;
      --nf-iron:         #2E2E2E;
      --nf-bone:         #FFFFFF;
      --nf-paper:        #F4F4F2;
      --nf-fog:          #B5B5B5;
      --nf-mist:         #8A8A8A;
      --nf-smoke:        #5C5C5C;
      --nf-coal:         #3A3A3A;
      --nf-ember:        #FF6B2C;
      --nf-ember-soft:   #FF8F5C;
      --nf-amber:        #F2B53A;
      --nf-glow:         #FFD49A;

      --bg-0:            var(--nf-black);
      --bg-1:            var(--nf-ink);
      --bg-2:            var(--nf-graphite);
      --bg-3:            var(--nf-shadow);
      --bg-4:            var(--nf-slate);
      --bg-hover:        var(--nf-iron);

      --fg-0:            var(--nf-bone);
      --fg-1:            var(--nf-fog);
      --fg-2:            var(--nf-mist);
      --fg-3:            var(--nf-smoke);
      --fg-disabled:     var(--nf-coal);

      --border-1:        rgba(255,255,255,0.08);
      --border-2:        rgba(255,255,255,0.16);
      --border-3:        rgba(255,255,255,0.32);

      --accent:          var(--nf-ember);
      --accent-soft:     var(--nf-ember-soft);

      --font-display:    "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-body:       "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono:       "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

      --fs-display-xl:   clamp(56px, 7.5vw, 112px);
      --fs-display-lg:   clamp(40px, 5vw, 72px);
      --fs-display-md:   clamp(32px, 3.5vw, 48px);
      --fs-h1:           36px;
      --fs-h2:           28px;
      --fs-h3:           22px;
      --fs-h4:           18px;
      --fs-body-lg:      18px;
      --fs-body:         16px;
      --fs-body-sm:      14px;
      --fs-caption:      13px;
      --fs-eyebrow:      11px;
      --fs-micro:        10px;

      --fw-light:        300;
      --fw-regular:      400;
      --fw-medium:       500;
      --fw-semibold:     600;
      --fw-bold:         700;

      --tracking-tight:  -0.02em;
      --tracking-normal: 0;
      --tracking-wide:   0.08em;
      --tracking-xwide:  0.22em;
      --tracking-xxwide: 0.34em;

      --lh-display:      1.02;
      --lh-tight:        1.15;
      --lh-snug:         1.3;
      --lh-body:         1.55;
      --lh-loose:        1.75;

      --s-1:   4px;
      --s-2:   8px;
      --s-3:   12px;
      --s-4:   16px;
      --s-5:   24px;
      --s-6:   32px;
      --s-7:   48px;
      --s-8:   64px;
      --s-9:   96px;
      --s-10:  128px;
      --s-11:  192px;

      --r-0:    0px;
      --r-1:    2px;
      --r-2:    4px;
      --r-3:    8px;
      --r-pill: 999px;

      --shadow-0:     none;
      --shadow-1:     0 1px 0 rgba(255,255,255,0.04) inset;
      --shadow-2:     0 8px 24px rgba(0,0,0,0.5);
      --shadow-3:     0 24px 64px rgba(0,0,0,0.65);
      --shadow-focus: 0 0 0 2px var(--nf-ember);

      --ease-out:     cubic-bezier(0.2, 0.7, 0.2, 1);
      --ease-in-out:  cubic-bezier(0.65, 0, 0.35, 1);
      --t-fast:       120ms;
      --t-med:        220ms;
      --t-slow:       420ms;
    }

    *, *::before, *::after { box-sizing: border-box; }
    * { margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg-1);
      color: var(--fg-0);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: var(--lh-body);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    button { cursor: pointer; font-family: inherit; }
    a { color: inherit; }
    input, textarea, select { font-family: inherit; color: inherit; }
    img { display: block; max-width: 100%; }

    ::placeholder { color: var(--fg-3); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--border-3); }

    #root { min-height: 100vh; }

    /* ── Hero image: always centered, capped at 1800px ── */
    .hero-bg {
      position: absolute;
      top: 0; bottom: 0;
      left: 50%; right: auto;
      transform: translateX(-50%);
      width: 100vw;
      background-position: center top;
    }

    /* ── Services / Portfolio grids: max 3 cols ── */
    .grid-3col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
      max-width: 1480px;
      margin: 0 auto;
    }
    .grid-3col-sm {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }
    @media (max-width: 860px) {
      .grid-3col   { grid-template-columns: repeat(2, 1fr) !important; }
      .grid-3col-sm { grid-template-columns: repeat(2, 1fr) !important; }
    }
    @media (max-width: 560px) {
      .grid-3col   { grid-template-columns: 1fr !important; }
      .grid-3col-sm { grid-template-columns: 1fr !important; }
    }

    /* ── Nav: stack on mobile, center wordmark ── */
    @media (max-width: 780px) {
      .nf-nav {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        gap: 12px !important;
        padding: 14px 24px !important;
      }
      .nav-spacer {
        display: none !important;
      }
      .nav-cta {
        justify-content: center !important;
      }
      .nav-cta button {
        padding: 8px 16px !important;
      }
      .nav-links {
        gap: 16px !important;
        flex-wrap: wrap !important;
        justify-content: center !important;
      }
    }

    /* ── Hero / Services spacing on mobile ── */
    @media (max-width: 780px) {
      .hero-section  { padding-top: 130px !important; }
      .hero-bg       { top: 40px !important; }
      .services-section { padding-top: 72px !important; }
    }

    /* ── Carousel: single full-width image on mobile ── */
    @media (max-width: 700px) {
      .carousel-grid { grid-template-columns: 1fr !important; }
      .carousel-side { display: none !important; }
    }

    /* ── À la carte: single column on mobile ── */
    @media (max-width: 800px) {
      .alacarte-grid { grid-template-columns: 1fr !important; }
      .alacarte-row  { border-right: none !important; }
    }
  </style>

  <!-- React + Babel for JSX -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <!-- ─── PRIMITIVE COMPONENTS ─────────────────────────────────────── -->
  <script type="text/babel">

    const Wordmark = ({ size = 16, color = "var(--fg-0)", spacing = "0.34em" }) => (
      <div style={{
        fontFamily: "var(--font-display)",
        fontWeight: 400,
        fontSize: size,
        letterSpacing: spacing,
        color,
        textTransform: "uppercase",
        whiteSpace: "nowrap",
        userSelect: "none",
      }}>
        NO&nbsp;FORM
      </div>
    );

    const Eyebrow = ({ children, color = "var(--fg-2)", style = {} }) => (
      <div style={{
        fontFamily: "var(--font-display)",
        fontWeight: 400,
        fontSize: 11,
        lineHeight: 1,
        letterSpacing: "0.22em",
        textTransform: "uppercase",
        color,
        ...style,
      }}>
        {children}
      </div>
    );

    const Button = ({ children, variant = "outline", size = "md", onClick, trailing = "→", style = {} }) => {
      const [hover, setHover] = React.useState(false);
      const [press, setPress] = React.useState(false);
      const isFill = variant === "fill" || hover;
      const pad = size === "sm" ? "10px 18px" : "16px 26px";
      const fontSize = size === "sm" ? 10 : 11;
      return (
        <button
          onClick={onClick}
          onMouseEnter={() => setHover(true)}
          onMouseLeave={() => { setHover(false); setPress(false); }}
          onMouseDown={() => setPress(true)}
          onMouseUp={() => setPress(false)}
          style={{
            display: "inline-flex",
            alignItems: "center",
            gap: 14,
            padding: pad,
            background: isFill ? "var(--fg-0)" : "transparent",
            color: isFill ? "var(--bg-0)" : "var(--fg-0)",
            border: `1px solid ${isFill ? "var(--fg-0)" : "rgba(255,255,255,0.32)"}`,
            borderRadius: 0,
            fontFamily: "var(--font-display)",
            fontWeight: isFill ? 500 : 400,
            fontSize,
            letterSpacing: "0.22em",
            textTransform: "uppercase",
            cursor: "pointer",
            transition: "background 220ms var(--ease-out), color 220ms var(--ease-out), border-color 220ms var(--ease-out), transform 80ms var(--ease-out)",
            transform: press ? "scale(0.98)" : "scale(1)",
            ...style,
          }}
        >
          {children}
          {trailing && <span style={{ fontSize: size === "sm" ? 12 : 14 }}>{trailing}</span>}
        </button>
      );
    };

    const IconButton = ({ children, size = 48, onClick, ariaLabel, style = {} }) => {
      const [hover, setHover] = React.useState(false);
      return (
        <button
          aria-label={ariaLabel}
          onClick={onClick}
          onMouseEnter={() => setHover(true)}
          onMouseLeave={() => setHover(false)}
          style={{
            width: size,
            height: size,
            borderRadius: 999,
            background: "transparent",
            border: `1px solid ${hover ? "var(--fg-0)" : "rgba(255,255,255,0.32)"}`,
            color: "var(--fg-0)",
            display: "inline-flex",
            alignItems: "center",
            justifyContent: "center",
            cursor: "pointer",
            fontFamily: "var(--font-display)",
            fontSize: 16,
            transition: "border-color 220ms var(--ease-out)",
            flexShrink: 0,
            ...style,
          }}
        >
          {children}
        </button>
      );
    };

    const EyebrowHeadline = ({ eyebrow, headline, sub, align = "center", maxWidth = 720 }) => (
      <div style={{
        display: "flex", flexDirection: "column",
        alignItems: align === "center" ? "center" : "flex-start",
        textAlign: align,
        gap: 14, maxWidth, margin: align === "center" ? "0 auto" : 0,
      }}>
        {eyebrow && <Eyebrow>{eyebrow}</Eyebrow>}
        <h2 style={{
          margin: 0,
          fontFamily: "var(--font-display)", fontWeight: 400,
          fontSize: "clamp(32px, 4.2vw, 56px)", lineHeight: 1.05,
          letterSpacing: "-0.02em", color: "var(--fg-0)",
        }}>{headline}</h2>
        {sub && <p style={{
          margin: 0, fontFamily: "var(--font-body)",
          fontSize: 16, lineHeight: 1.55, color: "var(--fg-1)",
          maxWidth: 540,
        }}>{sub}</p>}
      </div>
    );

    const EmberButton = ({ children, onClick, size = "sm", block = false }) => {
      const [hover, setHover] = React.useState(false);
      const [press, setPress] = React.useState(false);
      const isLg = size === "lg";
      return (
        <button
          onClick={onClick}
          onMouseEnter={() => setHover(true)}
          onMouseLeave={() => { setHover(false); setPress(false); }}
          onMouseDown={() => setPress(true)}
          onMouseUp={() => setPress(false)}
          style={{
            display: "inline-flex", alignItems: "center", justifyContent: "center",
            gap: isLg ? 14 : 10,
            padding: isLg ? "18px 28px" : "11px 20px",
            width: block ? "100%" : "auto",
            background: hover ? "var(--accent)" : "transparent",
            color: hover ? "var(--bg-0)" : "var(--fg-0)",
            border: `1px solid ${hover ? "var(--accent)" : "rgba(255,255,255,0.32)"}`,
            borderRadius: 0,
            fontFamily: "var(--font-display)",
            fontWeight: hover ? (isLg ? 500 : 600) : 400,
            fontSize: isLg ? 12 : 10, letterSpacing: "0.22em", textTransform: "uppercase",
            cursor: "pointer",
            transition: "background 220ms var(--ease-out), color 220ms var(--ease-out), border-color 220ms var(--ease-out), transform 80ms var(--ease-out)",
            transform: press ? "scale(0.97)" : "scale(1)",
            whiteSpace: "nowrap",
          }}
        >
          {children}
          <span style={{ fontSize: isLg ? 14 : 12 }}>→</span>
        </button>
      );
    };

    // ─── NAV ──────────────────────────────────────────────────────────

    const TopNav = ({ current, onNavigate, onBriefOpen }) => {
      const items = [
        { id: "products", label: "Products" },
        { id: "pricing",  label: "Pricing" },
        { id: "portfolio", label: "Portfolio" },
        { id: "about",    label: "About us" },
      ];
      const [scrolled, setScrolled] = React.useState(false);
      const [menuOpen, setMenuOpen] = React.useState(false);

      React.useEffect(() => {
        const fn = () => setScrolled(window.scrollY > 30);
        window.addEventListener("scroll", fn, { passive: true });
        return () => window.removeEventListener("scroll", fn);
      }, []);

      return (
        <nav className="nf-nav" style={{
          position: "fixed", top: 0, left: 0, right: 0, zIndex: 50,
          display: "grid", gridTemplateColumns: "auto 1fr auto", alignItems: "center",
          padding: "22px clamp(24px, 4vw, 48px)",
          background: scrolled ? "rgba(0,0,0,0.6)" : "transparent",
          backdropFilter: scrolled ? "blur(20px)" : "none",
          WebkitBackdropFilter: scrolled ? "blur(20px)" : "none",
          borderBottom: scrolled ? "1px solid var(--border-1)" : "1px solid transparent",
          transition: "background 220ms var(--ease-out), border-color 220ms var(--ease-out)",
        }}>
          <a
            href="#home"
            onClick={(e) => { e.preventDefault(); onNavigate("home"); }}
            style={{ textDecoration: "none" }}
          >
            <Wordmark />
          </a>

          <div className="nav-links" style={{ display: "flex", gap: 40, alignItems: "center", justifyContent: "center" }}>
            {items.map(it => (
              <a key={it.id}
                href={`#${it.id}`}
                onClick={(e) => { e.preventDefault(); onNavigate(it.id); }}
                style={{
                  fontFamily: "var(--font-display)", fontWeight: 400,
                  fontSize: 11, letterSpacing: "0.22em", textTransform: "uppercase",
                  color: current === it.id ? "var(--fg-0)" : "var(--fg-1)",
                  textDecoration: "none", cursor: "pointer",
                  transition: "color 120ms var(--ease-out)",
                }}
                onMouseEnter={(e) => e.currentTarget.style.color = "var(--fg-0)"}
                onMouseLeave={(e) => e.currentTarget.style.color = current === it.id ? "var(--fg-0)" : "var(--fg-1)"}
              >{it.label}</a>
            ))}
          </div>

          <div className="nav-cta" style={{ display: "flex", justifyContent: "flex-end" }}>
            <Button onClick={onBriefOpen}>Let's create</Button>
          </div>
        </nav>
      );
    };

    // ─── FOOTER ───────────────────────────────────────────────────────

    const FooterColumn = ({ title, links, onNavigate }) => (
      <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
        <Eyebrow>{title}</Eyebrow>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          {links.map((l, i) => (
            <a
              key={i}
              href={l.id ? `#${l.id}` : "#"}
              onClick={(e) => { if (l.id && onNavigate) { e.preventDefault(); onNavigate(l.id); } }}
              style={{
                fontFamily: "var(--font-body)", fontSize: 14,
                color: "var(--fg-1)", textDecoration: "none", cursor: "pointer",
                transition: "color 120ms var(--ease-out)",
              }}
              onMouseEnter={(e) => e.currentTarget.style.color = "var(--fg-0)"}
              onMouseLeave={(e) => e.currentTarget.style.color = "var(--fg-1)"}
            >{l.label}</a>
          ))}
        </div>
      </div>
    );

    const Footer = ({ onNavigate, onBriefOpen }) => (
      <footer style={{
        background: "var(--bg-0)",
        borderTop: "1px solid var(--border-1)",
        padding: "80px clamp(24px, 4vw, 48px) 32px",
        display: "flex", flexDirection: "column", gap: 64,
      }}>
        <div style={{
          display: "grid",
          gridTemplateColumns: "repeat(auto-fit, minmax(160px, 1fr))",
          gap: 48, alignItems: "start",
        }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 24, gridColumn: "span 1" }}>
            <Wordmark size={20} />
            <p style={{ margin: 0, color: "var(--fg-1)", fontSize: 14, lineHeight: 1.5, maxWidth: 320 }}>
              A creative studio building scroll‑stopping campaigns. AI‑enhanced production, manual polish.
            </p>
            <Button size="sm" onClick={onBriefOpen}>Start a brief</Button>
          </div>

          <FooterColumn title="Studio" links={[
            { label: "Products",  id: "products" },
            { label: "Pricing",   id: "pricing" },
            { label: "Portfolio", id: "portfolio" },
            { label: "About us",  id: "about" },
          ]} onNavigate={onNavigate}/>

          <FooterColumn title="Services" links={[
            { label: "Ad creatives" },
            { label: "Video creatives" },
            { label: "Web design" },
            { label: "Email & SMS" },
            { label: "AI UGC" },
          ]}/>

          <FooterColumn title="Contact" links={[
            { label: "hello@noform.studio" },
            { label: "Instagram" },
            { label: "LinkedIn" },
            { label: "Vimeo" },
          ]}/>
        </div>

        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "center",
          flexWrap: "wrap", gap: 12,
          paddingTop: 32, borderTop: "1px solid var(--border-1)",
          fontFamily: "var(--font-display)", fontSize: 10,
          letterSpacing: "0.22em", textTransform: "uppercase",
          color: "var(--fg-3)",
        }}>
          <span>© 2026 No Form Studio</span>
          <span>Built with vision · Delivered with precision</span>
        </div>
      </footer>
    );

    // ─── SHARED PAGE HEADER ───────────────────────────────────────────

    const PageHeader = ({ eyebrow, title, sub }) => (
      <section style={{
        padding: "180px clamp(24px, 4vw, 48px) 80px",
        background: "var(--bg-0)",
        borderBottom: "1px solid var(--border-1)",
      }}>
        <div style={{ maxWidth: 1280, margin: "0 auto", display: "flex", flexDirection: "column", gap: 24 }}>
          <Eyebrow>{eyebrow}</Eyebrow>
          <h1 style={{
            margin: 0, fontFamily: "var(--font-display)", fontWeight: 400,
            fontSize: "clamp(48px, 6vw, 96px)", lineHeight: 1.0,
            letterSpacing: "-0.02em", color: "var(--fg-0)", maxWidth: 1080,
          }}>{title}</h1>
          {sub && <p style={{ margin: 0, color: "var(--fg-1)", fontSize: 18, lineHeight: 1.55, maxWidth: 600 }}>{sub}</p>}
        </div>
      </section>
    );

    // ─── BRIEF MODAL ──────────────────────────────────────────────────

    const Field = ({ label, placeholder, multiline }) => {
      const [focus, setFocus] = React.useState(false);
      const [value, setValue] = React.useState("");
      const Tag = multiline ? "textarea" : "input";
      return (
        <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
          <label style={{ fontFamily: "var(--font-display)", fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", color: "var(--fg-2)" }}>{label}</label>
          <Tag
            rows={multiline ? 4 : undefined}
            value={value}
            onChange={(e) => setValue(e.target.value)}
            onFocus={() => setFocus(true)}
            onBlur={() => setFocus(false)}
            placeholder={placeholder}
            style={{
              padding: "14px 16px",
              background: "var(--bg-2)",
              border: `${focus ? 2 : 1}px solid ${focus ? "var(--accent)" : "var(--border-2)"}`,
              borderRadius: 4,
              color: "var(--fg-0)",
              fontFamily: "var(--font-body)",
              fontSize: 14,
              outline: "none",
              resize: multiline ? "vertical" : "none",
              width: "100%",
            }}
          />
        </div>
      );
    };

    const BriefModal = ({ open, onClose }) => {
      const [tier, setTier] = React.useState(null);
      const [sent, setSent] = React.useState(false);

      React.useEffect(() => {
        if (open) {
          setSent(false);
          setTier(null);
          document.body.style.overflow = "hidden";
        } else {
          document.body.style.overflow = "";
        }
        return () => { document.body.style.overflow = ""; };
      }, [open]);

      React.useEffect(() => {
        const onKey = (e) => { if (e.key === "Escape") onClose(); };
        if (open) window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, [open, onClose]);

      if (!open) return null;
      return (
        <div
          role="dialog"
          aria-modal="true"
          style={{
            position: "fixed", inset: 0, zIndex: 100,
            background: "rgba(0,0,0,0.78)",
            display: "flex", justifyContent: "flex-end",
            animation: "nfFade 220ms var(--ease-out)",
          }}
          onClick={onClose}
        >
          <style>{`
            @keyframes nfFade { from { opacity:0 } to { opacity:1 } }

            padding: "28px 32px",
            display: "grid",
            gridTemplateColumns: "1fr auto auto",
            alignItems: "center",
            gap: 24,
            borderRight: isLeftCol ? "1px solid var(--border-1)" : "none",
            borderBottom: "1px solid var(--border-1)",
            background: hover ? "var(--bg-2)" : "transparent",
            transition: "background 220ms var(--ease-out)",
          }}
          onMouseEnter={() => setHover(true)}
          onMouseLeave={() => setHover(false)}
        >
          <div style={{ display: "flex", flexDirection: "column", gap: 6, minWidth: 0 }}>
            <div style={{
              fontFamily: "var(--font-display)", fontWeight: 500,
              fontSize: 17, letterSpacing: "0.02em", color: "var(--fg-0)",
              lineHeight: 1.25,
            }}>{title}</div>
            <div style={{ fontFamily: "var(--font-body)", fontSize: 13, color: "var(--fg-2)", lineHeight: 1.4 }}>{note}</div>
          </div>
          <div style={{ display: "flex", alignItems: "baseline", gap: 2, fontFamily: "var(--font-display)", color: "var(--fg-0)" }}>
            <span style={{ fontSize: 14, color: "var(--fg-2)" }}>$</span>
            <span style={{ fontSize: 26, fontWeight: 400, letterSpacing: "-0.01em" }}>{price}</span>
          </div>
          <EmberButton onClick={onBriefOpen}>Add</EmberButton>
        </div>
      );
    };

    const ALaCarteSection = ({ onBriefOpen }) => (
      <div style={{ marginTop: 96, maxWidth: 1280, margin: "96px auto 0" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", marginBottom: 40, flexWrap: "wrap", gap: 20 }}>
          <div style={{ display: "flex", flexDirection: "column", gap: 14 }}>
            <Eyebrow>À la carte</Eyebrow>
            <h2 style={{
              margin: 0, fontFamily: "var(--font-display)", fontWeight: 400,
              fontSize: "clamp(32px, 3.6vw, 48px)", lineHeight: 1.05,
              letterSpacing: "-0.02em", color: "var(--fg-0)", maxWidth: 640,
            }}>One-off projects, fixed scope.</h2>
          </div>
          <p style={{ margin: 0, color: "var(--fg-1)", fontSize: 15, lineHeight: 1.55, maxWidth: 360 }}>
            For brands not ready for a retainer. Each item ships in 7–14 days.
          </p>
        </div>
        <div className="alacarte-grid" style={{ display: "grid", gridTemplateColumns: "repeat(2, 1fr)", gap: 0, borderTop: "1px solid var(--border-1)" }}>
          {ALACARTE.map((item, i) => (
            <ALaCarteRow key={i} {...item} idx={i} onBriefOpen={onBriefOpen}/>
          ))}
        </div>
      </div>
    );

    const Pricing = ({ onBriefOpen }) => (
      <main>
        <PageHeader eyebrow="Pricing" title="Three rooms. Same studio."
          sub="Monthly retainers. No setup fees. Cancel with 30 days."/>
        <section style={{ padding: "0 clamp(24px, 4vw, 48px) 120px", background: "var(--bg-1)" }}>
          <div style={{
            display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(280px, 1fr))", gap: 16,
            maxWidth: 1280, margin: "0 auto",
          }}>
            {TIERS.map((t, i) => <TierCard key={i} {...t} onBriefOpen={onBriefOpen}/>)}
          </div>
          <ALaCarteSection onBriefOpen={onBriefOpen}/>
        </section>
      </main>
    );

    // ─── PORTFOLIO PAGE ───────────────────────────────────────────────

    const PORTFOLIO_FULL = [
      { img: "carousel-1.jpg",          title: "DANKE SCHÖN",      category: "Fashion · Lookbook",     year: "2026" },
      { img: "carousel-2.jpg",          title: "CARDINALS",         category: "Streetwear · Campaign",  year: "2026" },
      { img: "carousel-3.jpg",          title: "FREEFALL",          category: "Editorial · Motion",     year: "2025" },
      { img: "service-product-cards.jpg", title: "OBSIDIAN",        category: "Outerwear · DTC",        year: "2025" },
      { img: "service-email-sms.jpg",   title: "DANKE SCHÖN — SS26", category: "Email · Launch",        year: "2025" },
      { img: "service-ad-creatives.jpg", title: "CARDINALS HERO",   category: "Ad · Performance",       year: "2025" },
    ];

    const Portfolio = () => (
      <main>
        <PageHeader eyebrow="Portfolio" title="Selected work, 2025 – 26."
          sub="Real client deliverables. Some confidential and shown with permission."/>
        <section style={{ padding: "0 clamp(24px, 4vw, 48px) 120px", background: "var(--bg-1)" }}>
          <div className="grid-3col-sm">
            {PORTFOLIO_FULL.map((p, i) => (
              <div key={i} style={{ position: "relative", aspectRatio: "3/4", overflow: "hidden", background: "var(--bg-2)" }}>
                <div style={{
                  position: "absolute", inset: 0,
                  backgroundImage: `url(assets/imagery/${p.img})`,
                  backgroundSize: "cover", backgroundPosition: "center",
                }}/>
                <div style={{
                  position: "absolute", inset: 0,
                  background: "linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.82) 100%)",
                }}/>
                <div style={{ position: "absolute", left: 22, bottom: 20, right: 22, display: "flex", flexDirection: "column", gap: 6 }}>
                  <Eyebrow style={{ color: "rgba(255,255,255,0.75)" }}>{p.category} · {p.year}</Eyebrow>
                  <div style={{ fontFamily: "var(--font-display)", fontSize: 22, letterSpacing: "0.04em", color: "var(--fg-0)" }}>{p.title}</div>
                </div>
              </div>
            ))}
          </div>
        </section>
      </main>
    );

    // ─── ABOUT PAGE ───────────────────────────────────────────────────

    const FounderCard = ({ img, name, role, bio }) => (
      <div style={{ background: "var(--bg-2)" }}>
        <div style={{
          aspectRatio: "4/3",
          backgroundImage: `url(assets/imagery/${img})`,
          backgroundSize: "cover", backgroundPosition: "center",
        }}/>
        <div style={{ padding: "32px 32px 36px", display: "flex", flexDirection: "column", gap: 14 }}>
          <Eyebrow>{role}</Eyebrow>
          <div style={{ fontFamily: "var(--font-display)", fontSize: 36, color: "var(--fg-0)", letterSpacing: "-0.01em" }}>{name}</div>
          <p style={{ margin: 0, color: "var(--fg-1)", fontSize: 15, lineHeight: 1.6 }}>{bio}</p>
        </div>
      </div>
    );

    const About = ({ onBriefOpen }) => (
      <main>
        <PageHeader eyebrow="About us" title="Two operators. One pipeline."
          sub="No Form is run by two people. We do not subcontract creative direction. We do not white-label."/>
        <section style={{ padding: "0 clamp(24px, 4vw, 48px) 120px", background: "var(--bg-1)" }}>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(min(360px, 100%), 1fr))", gap: 24, maxWidth: 1280, margin: "0 auto" }}>
            <FounderCard
              img="founder-will.jpg"
              name="Will"
              role="Creative direction · AI"
              bio="Started in music, added marketing and creative direction. Now CMO at betterskin.com."
            />
            <FounderCard
              img="founder-alex.jpg"
              name="Alex"
              role="Post · Adobe craft"
              bio="Premiere, After Effects, color, sound. Veteran of agency post and music video. The reason the work doesn't look like AI."
            />
          </div>
          <div style={{ maxWidth: 760, margin: "120px auto 0", textAlign: "center" }}>
            <p style={{
              fontFamily: "var(--font-display)", fontWeight: 400,
              fontSize: "clamp(24px, 2.6vw, 36px)", lineHeight: 1.35,
              color: "var(--fg-0)", margin: 0,
            }}>
              "The cheapest creative agency in the world is one that doesn't exist. The second cheapest is one that uses AI badly. We are neither."
            </p>
          </div>
        </section>
        <CTASection onBriefOpen={onBriefOpen}/>
      </main>
    );

    // ─── APP ROOT ─────────────────────────────────────────────────────

    const App = () => {
      const getRoute = () => (window.location.hash || "#home").replace("#", "") || "home";
      const [route, setRoute] = React.useState(getRoute);
      const [briefOpen, setBriefOpen] = React.useState(false);

      React.useEffect(() => {
        const onHash = () => {
          setRoute(getRoute());
          window.scrollTo({ top: 0, behavior: "instant" });
        };
        window.addEventListener("hashchange", onHash);
        return () => window.removeEventListener("hashchange", onHash);
      }, []);

      const go = (r) => { window.location.hash = `#${r}`; };
      const openBrief = () => setBriefOpen(true);
      const closeBrief = () => setBriefOpen(false);

      return (
        <div style={{ minHeight: "100vh", background: "var(--bg-1)" }}>
          <TopNav current={route} onNavigate={go} onBriefOpen={openBrief}/>
          {route === "home"      && <Home      onNavigate={go} onBriefOpen={openBrief}/>}
          {route === "products"  && <Products  onBriefOpen={openBrief}/>}
          {route === "pricing"   && <Pricing   onBriefOpen={openBrief}/>}
          {route === "portfolio" && <Portfolio/>}
          {route === "about"     && <About     onBriefOpen={openBrief}/>}
          <Footer onNavigate={go} onBriefOpen={openBrief}/>
          <BriefModal open={briefOpen} onClose={closeBrief}/>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

  </script>
</body>
</html>
