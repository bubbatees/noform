<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding: 0; min-height: unset; border: 1px solid var(--border-1);">
  <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border-1);">
    <div style="aspect-ratio: 3/4; background-image: url('../assets/imagery/hero.jpeg'); background-size: cover; background-position: center;"></div>
    <div style="aspect-ratio: 3/4; background-image: url('../assets/imagery/carousel-1.png'); background-size: cover; background-position: center;"></div>
    <div style="aspect-ratio: 3/4; background-image: url('../assets/imagery/carousel-3.png'); background-size: cover; background-position: center;"></div>
    <div style="aspect-ratio: 3/4; background-image: url('../assets/imagery/service-product-cards.png'); background-size: cover; background-position: center;"></div>
  </div>
  <div style="padding: 14px 24px; display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 9px; color: var(--fg-3); border-top: 1px solid var(--border-1); background: var(--bg-1);">
    <span>Cinematic AI</span>
    <span>Editorial</span>
    <span>Motion · b&amp;w</span>
    <span>Product still</span>
  </div>
</div></body></html>
