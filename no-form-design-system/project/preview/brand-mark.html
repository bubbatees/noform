<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding: 28px 32px;">
  <div class="row" style="gap: 22px; align-items: center;">
    <div style="width: 88px; height: 88px; border: 1px solid var(--fg-0); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;">
      <div style="font-family: var(--font-display); font-weight: 500; font-size: 18px; letter-spacing: 0.12em; color: var(--fg-0);">NO</div>
      <div style="font-family: var(--font-display); font-weight: 500; font-size: 18px; letter-spacing: 0.12em; color: var(--fg-0);">FM</div>
    </div>
    <div style="width: 56px; height: 56px; border: 1px solid var(--fg-0); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;">
      <div style="font-family: var(--font-display); font-weight: 500; font-size: 12px; letter-spacing: 0.1em; color: var(--fg-0);">NO</div>
      <div style="font-family: var(--font-display); font-weight: 500; font-size: 12px; letter-spacing: 0.1em; color: var(--fg-0);">FM</div>
    </div>
    <div style="width: 32px; height: 32px; border: 1px solid var(--fg-0); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;">
      <div style="font-family: var(--font-display); font-weight: 600; font-size: 7px; letter-spacing: 0.08em; color: var(--fg-0); line-height: 1.05;">NO</div>
      <div style="font-family: var(--font-display); font-weight: 600; font-size: 7px; letter-spacing: 0.08em; color: var(--fg-0); line-height: 1.05;">FM</div>
    </div>
    <div class="col" style="gap: 4px; padding-left: 12px; max-width: 280px;">
      <div style="font-family: var(--font-display); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-2);">Compact mark</div>
      <div style="font-family: var(--font-body); font-size: 12px; color: var(--fg-1); line-height: 1.5;">For favicons, app icons, watermarks. Outlined square, never filled.</div>
    </div>
  </div>
</div></body></html>
