<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding: 28px 32px; gap: 18px;">
  <div class="row" style="gap: 20px;">
    <div class="col" style="gap: 8px; align-items: center;">
      <div style="width: 86px; height: 86px; background: var(--bg-2);"></div>
      <span class="mono-tag">bg‑2 · base</span>
    </div>
    <div class="col" style="gap: 8px; align-items: center;">
      <div style="width: 86px; height: 86px; background: var(--bg-3);"></div>
      <span class="mono-tag">bg‑3 · hover</span>
    </div>
    <div class="col" style="gap: 8px; align-items: center;">
      <div style="width: 86px; height: 86px; background: var(--bg-4);"></div>
      <span class="mono-tag">bg‑4 · active</span>
    </div>
    <div class="col" style="gap: 8px; align-items: center;">
      <div style="width: 86px; height: 86px; background: var(--bg-3); box-shadow: 0 8px 24px rgba(0,0,0,0.5);"></div>
      <span class="mono-tag">shadow‑2</span>
    </div>
    <div class="col" style="gap: 8px; align-items: center;">
      <div style="width: 86px; height: 86px; background: var(--bg-3); box-shadow: 0 24px 64px rgba(0,0,0,0.75);"></div>
      <span class="mono-tag">shadow‑3</span>
    </div>
  </div>
  <div style="font-family: var(--font-body); font-size: 12px; color: var(--fg-2); line-height: 1.5;">Elevation comes from <em>lifting the surface</em>, not from shadow. Drop shadows reserved for floating overlays.</div>
</div></body></html>
