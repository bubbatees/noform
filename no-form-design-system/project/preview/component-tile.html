<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding: 0; min-height: unset;">
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0;">
    <!-- Tile -->
    <div style="background: var(--bg-2); padding: 0; display: flex; flex-direction: column;">
      <div style="aspect-ratio: 4/3; background: linear-gradient(135deg, #2a1810 0%, #4a2818 30%, #1a0a08 100%); position: relative; overflow: hidden;">
        <div style="position: absolute; inset: 0; background: radial-gradient(circle at 60% 40%, rgba(255,107,44,0.55), transparent 55%);"></div>
        <div style="position: absolute; left: 40%; top: 25%; width: 60px; height: 110px; background: linear-gradient(180deg, rgba(255,180,120,0.25), rgba(0,0,0,0.5)); filter: blur(2px); border-radius: 30px;"></div>
      </div>
      <div style="padding: 18px 20px 22px; display: flex; flex-direction: column; gap: 6px;">
        <div style="font-family: var(--font-display); font-weight: 500; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-0);">Video creatives</div>
        <div style="font-family: var(--font-body); font-size: 13px; color: var(--fg-1); line-height: 1.4;">Cinematic storytelling built for every platform.</div>
      </div>
    </div>
    <!-- Anatomy -->
    <div style="padding: 22px 28px; display: flex; flex-direction: column; gap: 14px; justify-content: center; background: var(--bg-1); border-left: 1px solid var(--border-1);">
      <div style="font-family: var(--font-display); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-2);">Tile anatomy</div>
      <ul style="margin: 0; padding-left: 16px; font-family: var(--font-body); font-size: 12px; color: var(--fg-1); line-height: 1.7;">
        <li>4:3 or 3:4 media well, full bleed</li>
        <li>No border, no radius</li>
        <li>Tracked‑caps title, 14–16px</li>
        <li>Sentence‑case sub, 13px, fog</li>
        <li>Hover · image scales 1.02 / 420ms</li>
      </ul>
    </div>
  </div>
</div></body></html>
