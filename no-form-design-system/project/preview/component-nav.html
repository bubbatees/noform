<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding: 0; min-height: unset; background: var(--bg-0);">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 36px; background: rgba(0,0,0,0.6); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-1);">
    <div style="font-family: var(--font-display); font-weight: 400; font-size: 16px; letter-spacing: 0.34em; color: var(--fg-0);">NO&nbsp;FORM</div>
    <div style="display: flex; gap: 36px;">
      <a style="font-family: var(--font-display); font-weight: 400; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-0); text-decoration: none;">Products</a>
      <a style="font-family: var(--font-display); font-weight: 400; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-0); text-decoration: none;">Pricing</a>
      <a style="font-family: var(--font-display); font-weight: 400; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-0); text-decoration: none;">Portfolio</a>
      <a style="font-family: var(--font-display); font-weight: 400; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-0); text-decoration: none;">About us</a>
    </div>
    <div style="display: inline-flex; align-items: center; gap: 12px; padding: 12px 22px; border: 1px solid rgba(255,255,255,0.32); color: var(--fg-0); font-family: var(--font-display); font-weight: 400; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;">Let's create <span>→</span></div>
  </div>
</div></body></html>
