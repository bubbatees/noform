<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding: 32px;">
  <div class="row" style="gap: 18px; align-items: center;">
    <button style="display: inline-flex; align-items: center; gap: 14px; padding: 16px 26px; background: transparent; border: 1px solid rgba(255,255,255,0.32); color: var(--fg-0); font-family: var(--font-display); font-weight: 400; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; cursor: pointer; border-radius: 0;">Let's create <span style="font-size: 14px;">→</span></button>
    <button style="display: inline-flex; align-items: center; gap: 14px; padding: 16px 26px; background: var(--fg-0); border: 1px solid var(--fg-0); color: var(--bg-0); font-family: var(--font-display); font-weight: 500; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; cursor: pointer; border-radius: 0;">Let's create <span style="font-size: 14px;">→</span></button>
    <button style="display: inline-flex; align-items: center; gap: 14px; padding: 16px 26px; background: transparent; border: 1px solid rgba(255,255,255,0.16); color: rgba(255,255,255,0.4); font-family: var(--font-display); font-weight: 400; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; cursor: not-allowed; border-radius: 0;">Disabled <span style="font-size: 14px;">→</span></button>
  </div>
  <div class="row" style="gap: 18px; font-family: var(--font-mono); font-size: 9px; color: var(--fg-3);">
    <span style="min-width: 168px;">default · hairline 32%</span>
    <span style="min-width: 168px;">hover · fill inverts</span>
    <span>disabled · opacity 0.4</span>
  </div>
</div></body></html>
