<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding: 0; min-height: unset;">
  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border-1);">
    <div style="background: var(--bg-0); padding: 36px 28px; display: flex; align-items: center; justify-content: center; min-height: 120px;">
      <div style="font-family: var(--font-display); font-weight: 400; font-size: 28px; letter-spacing: 0.34em; color: var(--fg-0);">NO&nbsp;FORM</div>
    </div>
    <div style="background: var(--nf-paper); padding: 36px 28px; display: flex; align-items: center; justify-content: center; min-height: 120px;">
      <div style="font-family: var(--font-display); font-weight: 400; font-size: 28px; letter-spacing: 0.34em; color: var(--nf-ink);">NO&nbsp;FORM</div>
    </div>
  </div>
</div></body></html>
