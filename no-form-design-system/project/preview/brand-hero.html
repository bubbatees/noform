<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding: 0; min-height: unset; background: var(--bg-0); position: relative; overflow: hidden; border: 1px solid var(--border-1);">
  <div style="position: relative; min-height: 320px; padding: 24px 32px; display: flex; flex-direction: column; justify-content: space-between;">
    <div style="position: absolute; inset: 0; background-image: url('../assets/imagery/hero.jpeg'); background-size: cover; background-position: center right;"></div>
    <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.55) 40%, transparent 75%);"></div>

    <div style="position: relative; z-index: 2; font-family: var(--font-display); font-weight: 400; font-size: 13px; letter-spacing: 0.34em; color: var(--fg-0);">NO&nbsp;FORM</div>

    <div style="position: relative; z-index: 2; display: flex; flex-direction: column; gap: 14px;">
      <div style="font-family: var(--font-display); font-weight: 400; font-size: 42px; line-height: 1.02; letter-spacing: -0.02em; color: var(--fg-0); max-width: 320px;">Efficiency meets taste.</div>
      <div style="font-family: var(--font-body); font-size: 12px; color: var(--fg-1); max-width: 280px; line-height: 1.5;">AI-enhanced creative production with human direction.</div>
      <div style="display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px; border: 1px solid rgba(255,255,255,0.4); color: var(--fg-0); font-family: var(--font-display); font-weight: 400; font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; width: fit-content;">See our work <span>→</span></div>
    </div>
  </div>
</div></body></html>
