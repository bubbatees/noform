<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding: 28px 32px; gap: 18px;">
  <div class="row" style="gap: 20px; align-items: stretch;">
    <div class="col" style="gap: 8px; align-items: center;">
      <div style="width: 100px; height: 60px; border: 1px solid rgba(255,255,255,0.08); background: var(--bg-2);"></div>
      <span class="mono-tag">border‑1 · 8%</span>
    </div>
    <div class="col" style="gap: 8px; align-items: center;">
      <div style="width: 100px; height: 60px; border: 1px solid rgba(255,255,255,0.16); background: var(--bg-2);"></div>
      <span class="mono-tag">border‑2 · 16%</span>
    </div>
    <div class="col" style="gap: 8px; align-items: center;">
      <div style="width: 100px; height: 60px; border: 1px solid rgba(255,255,255,0.32); background: var(--bg-2);"></div>
      <span class="mono-tag">border‑3 · 32%</span>
    </div>
    <div class="col" style="gap: 8px; align-items: center;">
      <div style="width: 100px; height: 60px; border: 2px solid #FF6B2C; background: var(--bg-2);"></div>
      <span class="mono-tag">focus · ember 2px</span>
    </div>
  </div>
  <div style="font-family: var(--font-body); font-size: 12px; color: var(--fg-2); line-height: 1.5;">Hairline borders replace shadows for "containers". Never coloured except focus.</div>
</div></body></html>
