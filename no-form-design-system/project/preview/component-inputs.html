<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding: 28px 32px; gap: 14px;">
  <div class="row" style="gap: 16px; align-items: stretch;">
    <div class="col" style="gap: 6px; flex: 1; min-width: 200px;">
      <label style="font-family: var(--font-display); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-2);">Email</label>
      <input value="alex@noform.studio" style="padding: 12px 14px; background: var(--bg-2); border: 1px solid var(--border-2); border-radius: 4px; color: var(--fg-0); font-family: var(--font-body); font-size: 14px; outline: none;">
    </div>
    <div class="col" style="gap: 6px; flex: 1; min-width: 200px;">
      <label style="font-family: var(--font-display); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-2);">Brand name</label>
      <input value="" placeholder="Acme Atelier" style="padding: 12px 14px; background: var(--bg-2); border: 2px solid #FF6B2C; border-radius: 4px; color: var(--fg-0); font-family: var(--font-body); font-size: 14px; outline: none;">
    </div>
  </div>
  <div class="row" style="gap: 8px; align-items: center;">
    <span style="display:inline-flex; align-items:center; gap: 6px; padding: 4px 10px; border: 1px solid var(--border-2); border-radius: 999px; font-family: var(--font-display); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-0);">Tier 1</span>
    <span style="display:inline-flex; align-items:center; gap: 6px; padding: 4px 10px; border: 1px solid var(--border-2); border-radius: 999px; font-family: var(--font-display); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-0);">Tier 2</span>
    <span style="display:inline-flex; align-items:center; gap: 6px; padding: 4px 10px; background: var(--fg-0); color: var(--bg-0); border-radius: 999px; font-family: var(--font-display); font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;">Tier 3 · selected</span>
  </div>
</div></body></html>
