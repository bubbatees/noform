<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding: 28px 32px;">
  <div class="row" style="gap: 28px; align-items: flex-end;">
    <div class="col" style="gap: 8px; align-items: center;">
      <div style="width: 72px; height: 72px; background: var(--bg-3); border: 1px solid var(--border-2); border-radius: 0;"></div>
      <span class="mono-tag">r‑0 · 0 · default</span>
    </div>
    <div class="col" style="gap: 8px; align-items: center;">
      <div style="width: 72px; height: 72px; background: var(--bg-3); border: 1px solid var(--border-2); border-radius: 2px;"></div>
      <span class="mono-tag">r‑1 · 2</span>
    </div>
    <div class="col" style="gap: 8px; align-items: center;">
      <div style="width: 72px; height: 72px; background: var(--bg-3); border: 1px solid var(--border-2); border-radius: 4px;"></div>
      <span class="mono-tag">r‑2 · 4 · inputs</span>
    </div>
    <div class="col" style="gap: 8px; align-items: center;">
      <div style="width: 72px; height: 72px; background: var(--bg-3); border: 1px solid var(--border-2); border-radius: 999px;"></div>
      <span class="mono-tag">r‑pill · circle</span>
    </div>
    <div class="col" style="gap: 4px; padding-left: 12px; max-width: 220px;">
      <div style="font-family: var(--font-display); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-2);">Sharp by default</div>
      <div style="font-family: var(--font-body); font-size: 13px; color: var(--fg-1); line-height: 1.5;">Tiles, sections, buttons — all rectangles. Curves only on inputs and circular controls.</div>
    </div>
  </div>
</div></body></html>
