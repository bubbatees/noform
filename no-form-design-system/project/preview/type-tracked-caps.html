<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding: 32px; gap: 22px;">
  <div class="col" style="gap: 8px;">
    <div style="font-family: var(--font-display); font-weight: 400; font-size: 11px; line-height: 1; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-2);">Our Portfolio</div>
    <div class="mono-tag">.t-eyebrow · 11px · 0.18em · fg-2</div>
  </div>
  <div class="col" style="gap: 8px;">
    <div style="font-family: var(--font-display); font-weight: 500; font-size: 16px; line-height: 1.1; letter-spacing: 0.08em; text-transform: uppercase; color: var(--fg-0);">Video creatives</div>
    <div class="mono-tag">.t-tile-title · 16px · 0.08em · fg-0</div>
  </div>
  <div class="col" style="gap: 8px;">
    <div style="display: inline-flex; align-items: center; gap: 10px; padding: 14px 22px; border: 1px solid var(--border-2); width: fit-content;">
      <span style="font-family: var(--font-display); font-weight: 400; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--fg-0);">Let's create</span>
      <span style="font-family: var(--font-display); font-size: 14px; color: var(--fg-0); line-height: 1;">→</span>
    </div>
    <div class="mono-tag">CTA label · 11px · 0.22em · uppercase</div>
  </div>
</div></body></html>
