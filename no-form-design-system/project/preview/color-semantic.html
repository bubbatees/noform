<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding: 24px; gap: 14px;">
  <div class="row" style="gap: 16px;">
    <div class="col" style="gap: 6px; align-items: center;">
      <div style="width: 56px; aspect-ratio: 1; background: #6BD58A;"></div>
      <span class="mono-tag">success</span>
    </div>
    <div class="col" style="gap: 6px; align-items: center;">
      <div style="width: 56px; aspect-ratio: 1; background: #F2B53A;"></div>
      <span class="mono-tag">warn</span>
    </div>
    <div class="col" style="gap: 6px; align-items: center;">
      <div style="width: 56px; aspect-ratio: 1; background: #FF5247;"></div>
      <span class="mono-tag">danger</span>
    </div>
    <div class="col" style="gap: 6px; align-items: center;">
      <div style="width: 56px; aspect-ratio: 1; background: #FF6B2C;"></div>
      <span class="mono-tag">accent</span>
    </div>
    <div class="col" style="gap: 4px; padding-left: 16px;">
      <div style="font-family: var(--font-display); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-2);">Semantic</div>
      <div style="font-family: var(--font-body); font-size: 13px; color: var(--fg-1); max-width: 260px; line-height: 1.5;">Used as 6×6 dots, 1px underlines, or icon tints. Almost never as fills.</div>
    </div>
  </div>
</div></body></html>
