<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding: 0; min-height: unset; border: 1px solid var(--border-1);">
  <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border-1);">
    <div style="position: relative; aspect-ratio: 3/4; overflow: hidden;">
      <div style="position: absolute; inset: 0; background-image: url('../assets/imagery/service-ad-creatives.png'); background-size: cover; background-position: center;"></div>
      <div style="position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.85) 100%);"></div>
      <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-family: var(--font-display); font-weight: 500; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-0);">Ad creatives</div>
        <div style="font-family: var(--font-body); font-size: 9px; color: rgba(255,255,255,0.78); line-height: 1.4;">Scroll-stopping ads that sell.</div>
      </div>
    </div>
    <div style="position: relative; aspect-ratio: 3/4; overflow: hidden;">
      <div style="position: absolute; inset: 0; background-image: url('../assets/imagery/service-video-creatives.png'); background-size: cover; background-position: center;"></div>
      <div style="position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.85) 100%);"></div>
      <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-family: var(--font-display); font-weight: 500; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-0);">Video creatives</div>
        <div style="font-family: var(--font-body); font-size: 9px; color: rgba(255,255,255,0.78); line-height: 1.4;">Cinematic storytelling.</div>
      </div>
    </div>
    <div style="position: relative; aspect-ratio: 3/4; overflow: hidden;">
      <div style="position: absolute; inset: 0; background-image: url('../assets/imagery/service-product-cards.png'); background-size: cover; background-position: center;"></div>
      <div style="position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.85) 100%);"></div>
      <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 4px;">
        <div style="font-family: var(--font-display); font-weight: 500; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--fg-0);">Product cards</div>
        <div style="font-family: var(--font-body); font-size: 9px; color: rgba(255,255,255,0.78); line-height: 1.4;">Optimized visuals.</div>
      </div>
    </div>
  </div>
</div></body></html>
