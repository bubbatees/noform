<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head>
<body><div class="card" style="padding: 28px 32px;">
  <div class="row" style="gap: 22px; align-items: center;">
    <button aria-label="Previous" style="width: 48px; height: 48px; border-radius: 999px; background: transparent; border: 1px solid rgba(255,255,255,0.32); color: var(--fg-0); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; font-family: var(--font-display);">←</button>
    <button aria-label="Next" style="width: 48px; height: 48px; border-radius: 999px; background: transparent; border: 1px solid rgba(255,255,255,0.32); color: var(--fg-0); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; font-family: var(--font-display);">→</button>
    <button aria-label="Play" style="width: 64px; height: 64px; border-radius: 999px; background: transparent; border: 1.5px solid var(--fg-0); color: var(--fg-0); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; padding-left: 4px;">▶</button>
    <button aria-label="Close" style="width: 40px; height: 40px; border-radius: 999px; background: var(--bg-3); border: 1px solid var(--border-1); color: var(--fg-0); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 14px;">✕</button>
    <div class="col" style="gap: 4px; padding-left: 10px;">
      <div style="font-family: var(--font-display); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--fg-2);">Icon buttons</div>
      <div style="font-family: var(--font-body); font-size: 12px; color: var(--fg-2); line-height: 1.5; max-width: 220px;">Circle, hairline, hover: border to 100%.</div>
    </div>
  </div>
</div></body></html>
